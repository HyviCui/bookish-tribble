<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>拍照识别物体质心标注工具</title>
    <!-- 使用本地 opencv.js，加速加载 -->
    <script src="opencv.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI}
        body{padding:16px;background:#f4f7fa;max-width:800px;margin:0 auto}
        h2{color:#222;margin-bottom:16px;text-align:center}
        .box{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 6px #00000012}
        video,canvas{width:100%;border:1px solid #ddd;border-radius:6px;background:#000}
        .btns{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
        button{padding:9px 14px;border:none;border-radius:6px;background:#1677ff;color:#fff;font-size:14px;cursor:pointer}
        button.gray{background:#888}
        button.danger{background:#f53f3f}
        #tip{margin:10px 0;color:#f53f3f;font-weight:500}
        #info{color:#333;margin:8px 0;font-weight:bold}
        .file-input{display:none}
        .file-label{display:inline-block;padding:9px 14px;background:#00b42a;color:#fff;border-radius:6px;cursor:pointer;font-size:14px}
        .err-tip{color:#f53f3f;margin-top:8px;display:none}
        /* 加载遮罩 */
        .loading-mask {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 18px;
            font-weight: 500;
            border-radius: 6px;
            justify-content: center;
            align-items: center;
            z-index: 10;
            flex-direction: column;
            gap: 12px;
        }
        .loading-mask .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .media-container { position: relative; }
    </style>
</head>
<body>
    <h2>📸 拍照/上传图片 · 自动识别物体质心</h2>

    <div class="box">
        <div class="media-container">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas" style="display:none;"></canvas>
            <!-- 加载遮罩 -->
            <div class="loading-mask" id="loadingMask">
                <div class="spinner"></div>
                <span>⏳ OpenCV 加载中，请稍候...</span>
            </div>
        </div>
        <div class="btns">
            <button onclick="takePhoto()">📸 拍照识别</button>
            <label class="file-label">
                📁 上传本地图片
                <input class="file-input" id="fileUpload" type="file" accept="image/*">
            </label>
            <button class="gray" onclick="clearCanvas()">🗑 清空画布</button>
            <button onclick="downloadImg()">⬇ 下载标注图片</button>
        </div>
        <div class="err-tip" id="fileErr">⚠️ 不支持该文件类型，请使用 JPG / PNG / WebP</div>
        <div id="info">质心坐标：--</div>
    </div>

    <div class="box">
        <canvas id="canvasResult"></canvas>
    </div>

<script>
    // ============================
    //  1. DOM 引用 & 状态
    // ============================
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const canvasResult = document.getElementById('canvasResult');
    const ctx = canvas.getContext('2d');
    const ctxResult = canvasResult.getContext('2d');
    const fileInput = document.getElementById('fileUpload');
    const fileErr = document.getElementById('fileErr');
    const infoText = document.getElementById('info');
    const loadingMask = document.getElementById('loadingMask');

    let stream = null;
    let opencvReady = false;

    // ============================
    //  2. 启动摄像头
    // ============================
    async function openCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 } }
            });
            video.srcObject = stream;
            await video.play();
            // 保证视频尺寸有效
            if (video.videoWidth === 0) {
                await new Promise(resolve => video.onloadedmetadata = resolve);
            }
        } catch (e) {
            infoText.innerText = "⚠️ 无法调用摄像头，请授予权限或上传本地图片";
            console.warn('Camera error:', e);
        }
    }

    // ============================
    //  3. 拍照
    // ============================
    function takePhoto() {
        if (!opencvReady) {
            infoText.innerText = "⏳ OpenCV 未就绪，请稍后重试";
            return;
        }
        const w = video.videoWidth || 640;
        const h = video.videoHeight || 480;
        if (w === 0 || h === 0) {
            infoText.innerText = "⚠️ 视频流未就绪";
            return;
        }
        canvas.width = w;
        canvas.height = h;
        canvas.style.display = 'block';
        ctx.drawImage(video, 0, 0);
        runDetect();
    }

    // ============================
    //  4. 上传图片
    // ============================
    fileInput.onchange = function(e) {
        fileErr.style.display = 'none';
        const file = e.target.files[0];
        if (!file) return;
        const allowed = ['image/jpeg','image/jpg','image/png','image/webp'];
        if (!allowed.includes(file.type)) {
            fileErr.style.display = 'block';
            fileInput.value = '';
            return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                canvas.style.display = 'block';
                ctx.drawImage(img, 0, 0);
                if (opencvReady) runDetect();
                else infoText.innerText = "⏳ OpenCV 加载中，请稍后...";
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    };

    // ============================
    //  5. 核心检测 (修复质心显示)
    // ============================
    function runDetect() {
        if (!opencvReady) {
            infoText.innerText = "⏳ OpenCV 未就绪";
            return;
        }
        if (canvas.width === 0 || canvas.height === 0) {
            infoText.innerText = "⚠️ 画布为空，请先拍照或上传图片";
            return;
        }

        // 复制画布内容到结果画布 (保持原图)
        canvasResult.width = canvas.width;
        canvasResult.height = canvas.height;
        ctxResult.drawImage(canvas, 0, 0);

        // 读取图像
        const src = cv.imread(canvasResult);
        if (src.empty()) {
            infoText.innerText = "⚠️ 无法读取图像";
            src.delete();
            return;
        }

        // 灰度 + 高斯模糊 + OTSU二值化
        const gray = new cv.Mat();
        const blurred = new cv.Mat();
        const binary = new cv.Mat();
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
        cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
        cv.threshold(blurred, binary, 0, 255, cv.THRESH_BINARY_INV + cv.THRESH_OTSU);

        // 形态学开运算去噪
        const kernel = cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(3, 3));
        const morph = new cv.Mat();
        cv.morphologyEx(binary, morph, cv.MORPH_OPEN, kernel);

        // 查找轮廓
        const contours = new cv.MatVector();
        const hierarchy = new cv.Mat();
        cv.findContours(morph, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

        let detected = 0;
        const coords = [];

        // 在显示图像上绘制
        const display = src.clone();

        for (let i = 0; i < contours.size(); i++) {
            const cnt = contours.get(i);
            const area = cv.contourArea(cnt);
            if (area < 150) continue;   // 过滤小噪点

            const m = cv.moments(cnt);
            if (m.m00 < 1e-6) continue;

            const cx = m.m10 / m.m00;
            const cy = m.m01 / m.m00;
            if (cx < 0 || cy < 0 || cx >= display.cols || cy >= display.rows) continue;

            detected++;
            coords.push({ x: Math.round(cx), y: Math.round(cy) });

            // 绘制绿色轮廓
            cv.drawContours(display, contours, i, [0, 255, 0, 255], 2);

            // 绘制红色质心 (大圆点 + 十字准星)
            const pt = new cv.Point(Math.round(cx), Math.round(cy));
            cv.circle(display, pt, 12, [0, 0, 255, 255], -1);
            cv.circle(display, pt, 6, [255, 255, 255, 200], 2);
            // 十字线
            const cross = 18;
            const white = [255, 255, 255, 220];
            cv.line(display, new cv.Point(Math.round(cx)-cross, Math.round(cy)),
                new cv.Point(Math.round(cx)-6, Math.round(cy)), white, 2);
            cv.line(display, new cv.Point(Math.round(cx)+6, Math.round(cy)),
                new cv.Point(Math.round(cx)+cross, Math.round(cy)), white, 2);
            cv.line(display, new cv.Point(Math.round(cx), Math.round(cy)-cross),
                new cv.Point(Math.round(cx), Math.round(cy)-6), white, 2);
            cv.line(display, new cv.Point(Math.round(cx), Math.round(cy)+6),
                new cv.Point(Math.round(cx), Math.round(cy)+cross), white, 2);

            // 坐标文字
            const label = `(${Math.round(cx)}, ${Math.round(cy)})`;
            const fontScale = 0.6;
            const thickness = 2;
            const textColor = [255, 255, 255, 255];
            const bgColor = [0, 0, 0, 180];
            const basePt = new cv.Point(Math.round(cx) + 16, Math.round(cy) - 16);
            const textSize = cv.getTextSize(label, cv.FONT_HERSHEY_SIMPLEX, fontScale, thickness);
            const tw = textSize.width + 12;
            const th = textSize.height + 10;
            const x0 = basePt.x - 6;
            const y0 = basePt.y - textSize.height - 4;
            cv.rectangle(display,
                new cv.Point(x0, y0),
                new cv.Point(x0 + tw, y0 + th),
                bgColor, -1);
            cv.putText(display, label,
                new cv.Point(basePt.x, basePt.y),
                cv.FONT_HERSHEY_SIMPLEX, fontScale, textColor, thickness);
        }

        // 显示结果
        cv.imshow(canvasResult, display);

        // 释放内存
        src.delete();
        gray.delete();
        blurred.delete();
        binary.delete();
        morph.delete();
        kernel.delete();
        contours.delete();
        hierarchy.delete();
        display.delete();

        // 更新信息
        if (detected === 0) {
            infoText.innerText = "🔍 未检测到物体 (尝试调整拍摄角度)";
        } else {
            const coordStr = coords.map(c => `(${c.x}, ${c.y})`).join('  ');
            infoText.innerText = `🧩 ${detected} 个物体  📍 ${coordStr}`;
        }
    }

    // ============================
    //  6. 清空 & 下载
    // ============================
    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctxResult.clearRect(0, 0, canvasResult.width, canvasResult.height);
        canvas.style.display = 'block';
        canvas.width = 640;
        canvas.height = 480;
        ctx.fillStyle = '#0b121a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        canvasResult.width = 640;
        canvasResult.height = 480;
        ctxResult.fillStyle = '#0b121a';
        ctxResult.fillRect(0, 0, canvasResult.width, canvasResult.height);
        infoText.innerText = "⚪ 已清空";
        fileErr.style.display = 'none';
    }

    function downloadImg() {
        if (canvasResult.width === 0 || canvasResult.height === 0) {
            alert('画布为空，请先拍照或上传图片');
            return;
        }
        const a = document.createElement('a');
        a.download = `质心标注_${Date.now()}.png`;
        a.href = canvasResult.toDataURL('image/png');
        a.click();
    }

    // ============================
    //  7. 初始化：等待 OpenCV 就绪
    // ============================
    async function init() {
        loadingMask.style.display = 'flex';

        // 等待 OpenCV 加载完成（cv.imread 可用即表示就绪）
        const checkReady = () => {
            return new Promise((resolve) => {
                if (typeof cv !== 'undefined' && cv.imread) {
                    resolve();
                } else {
                    const interval = setInterval(() => {
                        if (typeof cv !== 'undefined' && cv.imread) {
                            clearInterval(interval);
                            resolve();
                        }
                    }, 100);
                }
            });
        };

        await checkReady();
        opencvReady = true;
        loadingMask.style.display = 'none';
        console.log('✅ OpenCV 已就绪 (本地加载)');

        // 启动摄像头
        await openCamera();

        // 初始化画布背景
        if (video.videoWidth > 0) {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.style.display = 'block';
            ctx.fillStyle = '#0b121a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            canvasResult.width = canvas.width;
            canvasResult.height = canvas.height;
            ctxResult.fillStyle = '#0b121a';
            ctxResult.fillRect(0, 0, canvasResult.width, canvasResult.height);
            infoText.innerText = "📸 点击「拍照识别」或上传图片";
        }
    }

    // 页面关闭释放摄像头
    window.onbeforeunload = () => {
        if (stream) stream.getTracks().forEach(t => t.stop());
    };

    // 启动
    window.onload = init;

    // 暴露全局
    window.takePhoto = takePhoto;
    window.clearCanvas = clearCanvas;
    window.downloadImg = downloadImg;
    window.runDetect = runDetect;
</script>
</body>
</html>
